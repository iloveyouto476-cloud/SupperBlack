<script>
/*
  SUPPERBLACK WEB V1
  STEP 1 ONLY

  Result Area is prepared to receive real Search data later.
  No Backend, Supabase, API, or Research Pipeline is connected here.
*/

const searchInput = document.getElementById("searchInput");
const searchButton = document.getElementById("searchButton");
const micButton = document.getElementById("micButton");
const youtubeButton = document.getElementById("youtubeButton");
const musicButton = document.getElementById("musicButton");
const websiteButton = document.getElementById("websiteButton");
const backButton = document.getElementById("backButton");
const menuButton = document.getElementById("menuButton");
const toast = document.getElementById("toast");

const resultArea = document.getElementById("resultArea");
const resultQuery = document.getElementById("resultQuery");
const resultCount = document.getElementById("resultCount");
const resultList = document.getElementById("resultList");
const resultLoading = document.getElementById("resultLoading");
const resultEmpty = document.getElementById("resultEmpty");
const resultError = document.getElementById("resultError");

/*
  Result Data Contract
  จุดรับข้อมูลจริงในอนาคต
*/
function createResultItem(data = {}) {
    return {
        id: data.id || "",
        title: data.title || "",
        description: data.description || "",
        source: data.source || "",
        url: data.url || "",
        type: data.type || "webpage",
        image: data.image || "",
        content: data.content || "",
        relevance: typeof data.relevance === "number" ? data.relevance : null
    };
}

function createSearchResponse(data = {}) {
    const results = Array.isArray(data.results)
        ? data.results.map(createResultItem)
        : [];

    return {
        query: data.query || "",
        status: data.status || "success",
        total: results.length,
        results,
        error: data.error || null,
        elapsedMs: typeof data.elapsedMs === "number" ? data.elapsedMs : null
    };
}

/*
  Test Data
  ใช้เฉพาะตรวจ Result Area ใน STEP 1
*/
const TEST_SEARCH_RESULTS = [
    {
        id: "test-001",
        title: "ตัวอย่างผลการค้นหา SupPerBlack",
        description: "นี่คือผลการค้นหาทดสอบสำหรับตรวจสอบว่า Result Area สามารถรับข้อมูลและแสดงผลบน Acode ได้ถูกต้อง",
        source: "SupPerBlack Test",
        url: "",
        type: "webpage",
        image: "",
        content: "ข้อมูลรายละเอียดตัวอย่างสำหรับการทดสอบในขั้นตอน Web V1",
        relevance: 1.0
    },
    {
        id: "test-002",
        title: "ตัวอย่างผลการค้นหาเพิ่มเติม",
        description: "ผลลัพธ์รายการที่สอง ใช้สำหรับตรวจสอบว่าระบบสามารถแสดงหลายรายการได้",
        source: "SupPerBlack Test",
        url: "",
        type: "article",
        image: "",
        content: "ข้อมูลเพิ่มเติมของผลลัพธ์รายการที่สอง",
        relevance: 0.8
    }
];

let toastTimer = null;

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 1800);
}

function hideAllResultStates() {
    resultLoading.classList.remove("visible");
    resultEmpty.classList.remove("visible");
    resultError.classList.remove("visible");
}

function showResultArea() {
    resultArea.classList.add("visible");
}

function getResultIcon() {
    return `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18"></path>
            <path d="M12 3c2.2 2.5 3.3 5.5 3.3 9s-1.1 6.5-3.3 9c-2.2-2.5-3.3-9-3.3-9S9.8 5.5 12 3Z"></path>
        </svg>
    `;
}

function renderResultCard(result) {
    const card = document.createElement("article");
    card.className = "result-card";
    card.dataset.resultId = result.id;

    card.innerHTML = `
        <div class="result-card-top">
            <div class="result-icon">${getResultIcon()}</div>
            <div class="result-content">
                <h3 class="result-title">${escapeHTML(result.title)}</h3>
                <p class="result-description">${escapeHTML(result.description)}</p>
            </div>
        </div>
        <div class="result-source">
            <span class="source-name">${escapeHTML(result.source)}</span>
            <span class="source-type">${escapeHTML(result.type)}</span>
        </div>
    `;

    return card;
}

function renderResults(response) {
    resultList.innerHTML = "";
    hideAllResultStates();
    showResultArea();

    resultQuery.textContent = response.query
        ? `ค้นหา: ${response.query}`
        : "";

    if (response.status === "error") {
        resultError.classList.add("visible");
        resultCount.textContent = "";
        return;
    }

    if (!response.results.length) {
        resultEmpty.classList.add("visible");
        resultCount.textContent = "0 รายการ";
        return;
    }

    resultCount.textContent = `${response.results.length} รายการ`;

    response.results.forEach(result => {
        resultList.appendChild(renderResultCard(result));
    });
}

async function search(query) {
    showResultArea();
    hideAllResultStates();
    resultList.innerHTML = "";
    resultQuery.textContent = `ค้นหา: ${query}`;
    resultCount.textContent = "";
    resultLoading.classList.add("visible");

    await wait(500);

    renderResults(createSearchResponse({
        query,
        status: "success",
        results: TEST_SEARCH_RESULTS,
        elapsedMs: 500
    }));
}

async function performSearch() {
    const query = searchInput.value.trim();

    if (!query) {
        searchInput.focus();
        showToast("กรุณาพิมพ์สิ่งที่ต้องการค้นหา");
        return;
    }

    await search(query);
}

searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        event.preventDefault();
        performSearch();
    }
});

searchButton.addEventListener("click", performSearch);

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

micButton.addEventListener("click", () => {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        showToast("เบราว์เซอร์นี้ยังไม่รองรับเสียง");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "th-TH";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => showToast("กำลังฟัง...");

    recognition.onresult = event => {
        searchInput.value = event.results[0][0].transcript;
        showToast("รับเสียงแล้ว");
    };

    recognition.onerror = () => {
        showToast("ไม่สามารถรับเสียงได้");
    };

    recognition.start();
});

youtubeButton.addEventListener("click", () => {
    window.open("https://www.youtube.com/", "_blank");
});

musicButton.addEventListener("click", () => {
    showToast("ระบบเพลงยังอยู่ระหว่างพัฒนา");
});

websiteButton.addEventListener("click", () => {
    showToast("ระบบเว็บไซต์ยังอยู่ระหว่างพัฒนา");
});

backButton.addEventListener("click", () => {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        showToast("ไม่มีหน้าก่อนหน้า");
    }
});

menuButton.addEventListener("click", () => {
    showToast("เมนูยังอยู่ระหว่างพัฒนา");
});
</script>
</body>
