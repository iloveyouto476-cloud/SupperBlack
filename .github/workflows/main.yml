name: Build SupperBlack A0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract A0 APK Project
        run: |
          mkdir -p a0
          unzip -q SupperBlack_A0_APK_Project.zip -d a0

      - name: Find Gradle project
        id: project
        run: |
          SETTINGS=$(find a0 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found in A0 project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show A0 project structure
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== A0 PROJECT ====="
          find . -maxdepth 5 -type f | sort
          echo "===== GRADLE WRAPPER CONFIG ====="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "===== APP BUILD FILE ====="
          sed -n '1,220p' app/build.gradle

      - name: Set up the exact Gradle version declared by A0 project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          DISTRIBUTION_URL=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\:/:/g')

          if [ -z "$DISTRIBUTION_URL" ]; then
            echo "ERROR: distributionUrl was not found in gradle-wrapper.properties."
            exit 1
          fi

          echo "Gradle distribution: $DISTRIBUTION_URL"

          mkdir -p "$RUNNER_TEMP/gradle"
          curl -fsSL "$DISTRIBUTION_URL" -o "$RUNNER_TEMP/gradle/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle/gradle.zip" -d "$RUNNER_TEMP/gradle"

          GRADLE_HOME=$(find "$RUNNER_TEMP/gradle" -maxdepth 1 -mindepth 1 -type d | head -n 1)

          if [ -z "$GRADLE_HOME" ] || [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            echo "ERROR: Gradle distribution could not be prepared."
            exit 1
          fi

          echo "GRADLE_HOME=$GRADLE_HOME"
          echo "GRADLE_HOME=$GRADLE_HOME" >> "$GITHUB_ENV"
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses and install required Android SDK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          COMPILE_SDK=$(grep -Eo 'compileSdk(Version)?[[:space:]]+[0-9]+' app/build.gradle | grep -Eo '[0-9]+' | head -n 1)

          if [ -z "$COMPILE_SDK" ]; then
            echo "ERROR: Could not determine compileSdk from app/build.gradle."
            exit 1
          fi

          echo "compileSdk=$COMPILE_SDK"
          sdkmanager "platforms;android-$COMPILE_SDK" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle --version
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find a0 -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SupperBlack-A0-debug-APK
          path: a0/**/*.apk
          if-no-files-found: error
